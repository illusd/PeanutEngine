name: PeanutEngine
version: '2.2.0'
main: com.peanutengine.PeanutEnginePlugin
api-version: '1.21'
author: PeanutEngine
description: Full survival QoL - keep inventory, map radar, economy, TPA, homes, land, vein
commands:
  pe:
    description: Help
  money:
    description: Balance
    aliases: [bal, balance]
  pay:
    description: Pay player
  ah:
    description: Auction
  rtp:
    description: Random teleport
  tpa:
    description: TPA request
  tpahere:
    description: TPA here
  tpaccept:
    description: Accept TPA
    aliases: [tpaaccept]
  tpacancel:
    description: Cancel TPA
    aliases: [tpadeny, tpdeny]
  tpauto:
    description: Auto-accept TPA
  seth:
    description: Set home
    aliases: [sethome]
  h:
    description: Home
    aliases: [home]
  delh:
    description: Delete home
    aliases: [delhome]
  bp:
    description: Backpack
  t:
    description: Land claims
  delt:
    description: Delete land
  sleep:
    description: Bed recall
  map:
    description: On-screen live radar map
    usage: /map [live]
  ban:
    description: Ban
    permission: peanutengine.ban
  unban:
    description: Unban
    permission: peanutengine.ban
  banlist:
    description: Ban list
    permission: peanutengine.ban
permissions:
  peanutengine.ban:
    default: op
  peanutengine.admin:
    default: op
